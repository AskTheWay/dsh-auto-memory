name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install (dev deps + auto-installed peers)
        run: npm install
      - name: Type check (strict)
        run: npx tsc --noEmit
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Smoke-load the built entry
        run: node -e "import('./lib/index.js').then(m => { if (!m.apply || !m.inject) throw new Error('bad entry exports') ; console.log('entry ok:', Object.keys(m).join(', ')) })"
